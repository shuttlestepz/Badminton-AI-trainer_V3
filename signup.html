<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up — Shuttlestepz</title>
<link rel="icon" type="image/png" href="/Badminton-AI-trainer_V3/icon/icon-192.png">
<link rel="stylesheet" href="/Badminton-AI-trainer_V3/css/base.css">
<link rel="stylesheet" href="/Badminton-AI-trainer_V3/css/signup.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
html,body{overflow-x:hidden}
body{font-family:'Sora',system-ui,sans-serif;background:#0a1410;color:#e8f2ec}
:focus-visible{outline:2px solid #39e07a;outline-offset:2px}

/* ── full-page picture ───────────────────────────────── */
.auth-root{position:relative;isolation:isolate;min-height:100vh;min-height:100dvh;display:flex;align-items:flex-end;justify-content:flex-end;overflow:hidden;padding:28px clamp(20px,6vw,100px)}
.ss-bg{position:absolute;inset:0;z-index:-2;background:#0a1410 url('/Badminton-AI-trainer_V3/icon/BG img loging and signup.jpg') center/cover no-repeat}
.ss-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(10,20,16,.9) 0%,rgba(10,20,16,0) 38%),linear-gradient(90deg,rgba(10,20,16,0) 38%,rgba(10,20,16,.5) 100%)}

/* brand text over the picture (left) */
.ss-brand{position:absolute;inset:0;z-index:-1;padding:40px;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}
.ss-logo{pointer-events:auto;display:inline-flex;align-items:center;gap:10px;align-self:flex-start;text-decoration:none;color:#e8f2ec;font-weight:700;font-size:18px}
.ss-label{font:500 12px/1 'DM Mono',monospace;letter-spacing:.16em;color:#39e07a;margin:0 0 18px}
.ss-title{font-size:clamp(30px,3.6vw,54px);font-weight:800;line-height:1.02;letter-spacing:-.03em;text-transform:uppercase;margin:0 0 16px;color:#f2f7f3}
.ss-sub{color:#a9bbb0;font-size:15px;margin:0}

/* ── form card (glass) ───────────────────────────────── */
.auth-root .auth-panel{position:relative;z-index:1;flex:none;width:100%;max-width:440px;min-height:0;padding:0;background:none;border:0;display:block}
.auth-root .auth-box{width:100%;max-width:none;margin:0;padding:26px 28px;border-radius:22px;background:rgba(10,20,16,.66);-webkit-backdrop-filter:blur(20px) saturate(1.15);backdrop-filter:blur(20px) saturate(1.15);border:1px solid rgba(57,224,122,.18);box-shadow:0 30px 80px -24px rgba(0,0,0,.75),inset 0 1px 0 rgba(255,255,255,.05)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.auth-root .auth-box{background:rgba(10,20,16,.9)}}
.auth-title{font-weight:800;letter-spacing:-.02em}

/* banners */
.banner-success{background:rgba(57,224,122,.1);border:1px solid rgba(57,224,122,.3);color:#b9f3cd}

/* ── inputs ──────────────────────────────────────────── */
.auth-root .form-group{margin-bottom:12px}
.auth-root .form-label{display:block;margin:0 0 8px;font:500 11px/1 'DM Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:#8fa699;transition:color .2s}
.auth-root .form-group:focus-within .form-label{color:#39e07a}
.auth-root .form-input{width:100%;height:46px;padding:0 16px;box-sizing:border-box;border-radius:12px;border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.045);color:#eef5ef;font:500 15px 'Sora',system-ui,sans-serif;transition:border-color .2s,box-shadow .2s,background-color .2s}
.auth-root .form-input::placeholder{color:rgba(232,242,236,.36)}
.auth-root .form-input:hover{border-color:rgba(57,224,122,.35)}
.auth-root .form-input:focus{outline:none;border-color:#39e07a;background:rgba(57,224,122,.06);box-shadow:0 0 0 3px rgba(57,224,122,.16)}
.form-input[aria-invalid="true"]{border-color:#e04848!important;box-shadow:0 0 0 3px rgba(224,72,72,.14)!important}
.form-input:-webkit-autofill,.form-input:-webkit-autofill:hover,.form-input:-webkit-autofill:focus{-webkit-text-fill-color:#eef5ef;caret-color:#eef5ef;-webkit-box-shadow:0 0 0 1000px #15251c inset;box-shadow:0 0 0 1000px #15251c inset;border-color:rgba(57,224,122,.4);transition:background-color 9999s ease-out}
.form-hint{font-size:12px;color:#7d9487;margin-top:5px}
.pw-wrap{position:relative}
.pw-wrap .form-input{padding-right:50px}
.pw-toggle{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:38px;height:38px;display:flex;align-items:center;justify-content:center;background:none;border:0;border-radius:8px;cursor:pointer;color:#8fa699;transition:color .2s}
.pw-toggle:hover{color:#39e07a}
.pw-toggle .i-off{display:none}
.pw-toggle.is-on .i-on{display:none}
.pw-toggle.is-on .i-off{display:inline}
.ss-field-err{color:#ff8a8a;font-size:12px;margin:7px 0 0}
.ss-field-err:empty{display:none}
.strength-bar{height:4px;background:rgba(255,255,255,.1);border-radius:3px;margin-top:10px;overflow:hidden}
.strength-fill{height:100%;width:0;border-radius:3px;transition:width .3s,background .3s}
.strength-label{font-size:12px;margin-top:4px;min-height:0}

/* ── terms, buttons, divider ─────────────────────────── */
.terms-row{display:flex;align-items:flex-start;gap:10px;font-size:13px;line-height:1.5;color:#a9bbb0;margin:6px 0 4px}
.terms-row input{margin-top:3px;width:16px;height:16px;flex:none;accent-color:#39e07a}
.terms-row a{color:#39e07a;text-decoration:none}
.terms-row a:hover{text-decoration:underline}
.auth-root #btn-signup{height:46px;padding:0 16px;font-size:15px;border-radius:12px;margin-top:12px}
.ss-or{display:flex;align-items:center;gap:12px;margin:20px 0;color:#7d9487;font:12px 'DM Mono',monospace}
.ss-or::before,.ss-or::after{content:"";flex:1;height:1px;background:rgba(255,255,255,.1)}
.btn-google{width:100%;height:46px;display:flex;align-items:center;justify-content:center;gap:10px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.045);color:#eef5ef;font:600 14px 'Sora',sans-serif;cursor:pointer;transition:background .2s,border-color .2s}
.btn-google:hover:not(:disabled){background:rgba(57,224,122,.07);border-color:#39e07a}
.btn-google:disabled{opacity:.6;cursor:not-allowed}
.auth-footer{margin-top:22px;text-align:center;font-size:13px;color:#a9bbb0}

/* ── tablet / mobile ─────────────────────────────────── */
@media (max-width:900px){
  /* picture becomes a banner at the top; card sits just below it */
  .auth-root{justify-content:center;align-items:flex-start;padding:46vw 16px 28px}
  .ss-brand{padding:18px}
  .ss-copy{display:none}
  .ss-bg{inset:0 0 auto 0;height:72vw;background-size:100% auto;background-position:center top;transform:none}
  .ss-bg::after{background:linear-gradient(180deg,rgba(10,20,16,.35) 0%,rgba(10,20,16,0) 28%,rgba(10,20,16,.85) 68%,#0a1410 80%)}
  .auth-root .auth-box{padding:24px 20px}
  .auth-root .auth-title{font-size:22px}
  /* 16px stops iPhones zooming in when a field is tapped */
  .auth-root .form-input,.modal .form-input{font-size:16px}
}

/* ── card sits low, picture lifted so the shuttlecock stays visible ── */
.auth-root .auth-title{font-size:26px;margin-bottom:6px}
.auth-root .auth-subtitle{margin-bottom:18px}
.ss-or{margin:16px 0}
.auth-footer{margin-top:16px}
@media (min-width:901px){
  .ss-bg{transform:scale(1.1);transform-origin:50% 100%}
}

@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style>
</head>
<body>

<div class="auth-root">

  <!-- ════ FULL-PAGE PICTURE ════ -->
  <div class="ss-bg" aria-hidden="true"></div>

  <!-- ════ BRAND TEXT OVER PICTURE ════ -->
  <div class="ss-brand">
    <a href="index.html" class="ss-logo" aria-label="Shuttlestepz home">
      <img src="/Badminton-AI-trainer_V3/icon/icon-512.png" alt="" width="36" height="36" style="border-radius:8px">
      <span>Shuttlestepz</span>
    </a>
    <div class="ss-copy">
      <p class="ss-label">FREE TO START</p>
      <h2 class="ss-title">From beginner.<br>To elite.</h2>
      <p class="ss-sub">Create your account in 30 seconds. No credit card needed.</p>
    </div>
  </div>

  <!-- ════ FORM CARD ════ -->
  <div class="auth-panel">
    <div class="auth-box">

      <h1 class="auth-title">Create account</h1>
      <p class="auth-subtitle">Join thousands training smarter with AI coaching.</p>

      <div class="banner banner-error" id="error-banner">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <circle cx="8" cy="8" r="7" stroke="#e04848" stroke-width="1.5"/>
          <path d="M8 5v3.5M8 11v.5" stroke="#e04848" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <span id="error-msg"></span>
      </div>

      <div class="banner banner-success" id="success-banner">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <circle cx="8" cy="8" r="7" stroke="#39e07a" stroke-width="1.5"/>
          <path d="M5 8l2 2 4-4" stroke="#39e07a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span id="success-msg"></span>
      </div>

      <form id="signup-form" onsubmit="return false" novalidate>

        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <input class="form-input" type="text" id="username"
            placeholder="e.g. shuttler99" autocomplete="username" required aria-describedby="username-err">
          <p class="ss-field-err" id="username-err" role="alert"></p>
          <div class="form-hint">At least 3 characters · Shown on leaderboard</div>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input class="form-input" type="email" id="email"
            placeholder="you@example.com" autocomplete="email" required aria-describedby="email-err">
          <p class="ss-field-err" id="email-err" role="alert"></p>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="pw-wrap">
            <input class="form-input" type="password" id="password"
              placeholder="Min. 6 characters" autocomplete="new-password"
              required aria-describedby="pw-err">
            <button type="button" class="pw-toggle" id="toggle-pw" aria-label="Show password" aria-pressed="false">
              <svg class="i-on" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="i-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.9 10.9 0 0 1 12 19c-7 0-11-7-11-7a19.8 19.8 0 0 1 5.06-5.94M9.9 4.24A10.9 10.9 0 0 1 12 4c7 0 11 7 11 7a19.9 19.9 0 0 1-3.17 4.19M14.12 14.12a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>
            </button>
          </div>
          <p class="ss-field-err" id="pw-err" role="alert"></p>
          <div class="strength-bar"><div class="strength-fill" id="strength-fill"></div></div>
          <div class="strength-label" id="strength-label"></div>
        </div>

        <div class="terms-row">
          <input type="checkbox" id="terms" required aria-describedby="terms-err">
          <label for="terms">
            I agree to the <a href="#">Terms of Service</a> and
            <a href="#">Privacy Policy</a>.
            Data stored on Firebase — never sold.
          </label>
        </div>
        <p class="ss-field-err" id="terms-err" role="alert"></p>

        <button type="submit" class="btn btn-primary btn-full" id="btn-signup">Create Account →</button>

      </form>

      <div class="ss-or"><span>or</span></div>
      <button type="button" class="btn-google" id="btn-google">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.5 28.7a14.5 14.5 0 0 1 0-9.4l-7.9-6.1a24 24 0 0 0 0 21.6l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.9 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
        Continue with Google
      </button>

      <div class="auth-footer">
        Already have an account? <a href="login.html">Log In</a>
      </div>

    </div>
  </div>

</div>

<script type="module">
  import AUTH from '/Badminton-AI-trainer_V3/js/auth.js'

  window.AUTH = AUTH
  console.log('[signup] ✅ AUTH loaded')

  // Redirect if already logged in
  AUTH.requireGuest()

  // ── Password toggle ──────────────────────────────────────
  const pwEl = document.getElementById('password')
  document.getElementById('toggle-pw').onclick = () => {
    const btn  = document.getElementById('toggle-pw')
    const show = pwEl.type === 'password'
    pwEl.type = show ? 'text' : 'password'
    btn.classList.toggle('is-on', show)
    btn.setAttribute('aria-pressed', String(show))
    btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password')
  }

  // ── Password strength ────────────────────────────────────
  const STRENGTHS = [
    { label: '',            color: 'transparent' },
    { label: 'Weak',        color: '#e04848' },
    { label: 'Fair',        color: '#f5c518' },
    { label: 'Good',        color: '#f5c518' },
    { label: 'Strong',      color: '#39e07a' },
    { label: 'Very strong', color: '#39e07a' },
  ]
  pwEl.addEventListener('input', () => {
    const pw = pwEl.value
    let s = 0
    if (pw.length >= 6)           s++
    if (pw.length >= 10)          s++
    if (/[A-Z]/.test(pw))         s++
    if (/[0-9]/.test(pw))         s++
    if (/[^a-zA-Z0-9]/.test(pw))  s++
    const st = STRENGTHS[s]
    document.getElementById('strength-fill').style.cssText = `width:${s * 20}%;background:${st.color}`
    const lbl = document.getElementById('strength-label')
    lbl.textContent = st.label
    lbl.style.color = st.color
  })

  // ── Banner helpers ───────────────────────────────────────
  const errB = document.getElementById('error-banner')
  const sucB = document.getElementById('success-banner')
  function showErr(msg) {
    document.getElementById('error-msg').textContent = msg
    errB.classList.add('show'); sucB.classList.remove('show')
  }
  function showSuc(msg) {
    document.getElementById('success-msg').textContent = msg
    sucB.classList.add('show'); errB.classList.remove('show')
  }
  function setLoading(on) {
    const b = document.getElementById('btn-signup')
    b.disabled = on
    b.innerHTML = on ? '<span class="btn-spinner"></span>Creating account…' : 'Create Account →'
  }

  // ── Signup submit ────────────────────────────────────────
  document.getElementById('signup-form').addEventListener('submit', async () => {
    const userEl  = document.getElementById('username')
    const emailEl = document.getElementById('email')
    const username = userEl.value.trim()
    const email    = emailEl.value.trim()
    const pw       = pwEl.value
    const terms    = document.getElementById('terms').checked

    for (const id of ['username-err','email-err','pw-err','terms-err']) document.getElementById(id).textContent = ''
    for (const el of [userEl, emailEl, pwEl]) el.removeAttribute('aria-invalid')
    errB.classList.remove('show'); sucB.classList.remove('show')

    let bad = false
    const fail = (el, errId, msg) => {
      document.getElementById(errId).textContent = msg
      if (el) el.setAttribute('aria-invalid', 'true')
      bad = true
    }
    if (username.length < 3) fail(userEl, 'username-err', 'Username must be at least 3 characters.')
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) fail(emailEl, 'email-err', 'Enter a valid email address.')
    if (pw.length < 6) fail(pwEl, 'pw-err', 'Password must be at least 6 characters.')
    if (!terms) fail(null, 'terms-err', 'Please accept the Terms of Service.')
    if (bad) return

    setLoading(true)
    try {
      // Every new account starts as a Free student
      const res = await AUTH.signup(username, email, pw, 'student', null, null)
      if (res.ok) {
        showSuc('Account created. Taking you to your dashboard…')
        setTimeout(() => { window.location.href = 'dashboard.html' }, 500)
      } else {
        showErr(res.msg)
        setLoading(false)
      }
    } catch (err) {
      console.error('[signup] Unexpected error:', err)
      showErr('An unexpected error occurred. Please try again.')
      setLoading(false)
    }
  })

  // ── Google sign-up (creates the profile on first use) ────
  document.getElementById('btn-google').addEventListener('click', async () => {
    if (typeof AUTH.loginWithGoogle !== 'function') return showErr('Google sign-in is not set up yet.')
    const gb = document.getElementById('btn-google')
    errB.classList.remove('show'); sucB.classList.remove('show')
    gb.disabled = true
    try {
      const res = await AUTH.loginWithGoogle(true)
      if (res.ok) {
        showSuc('Signed in. Taking you to your dashboard…')
        setTimeout(() => { window.location.href = 'dashboard.html' }, 500)
        return
      }
      if (!res.cancelled) showErr(res.msg)
    } catch (err) {
      showErr('Google sign-in failed. Please try again.')
    }
    gb.disabled = false
  })
</script>
</body>
</html>
